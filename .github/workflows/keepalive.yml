name: Keepalive Scheduled Workflows

# GitHub automatically disables scheduled (cron) workflows in public repositories
# if there has been no repository commit activity for 60 consecutive days.
#
# Crucial Rule: Commits pushed by GitHub Actions using the default GITHUB_TOKEN
# (such as github-actions[bot]) DO NOT reset this 60-day inactivity timer!
#
# This workflow prevents automatic schedule suspension by pinging the repository
# every month using the keepalive action.

on:
  schedule:
    # Run on the 1st of every month at 00:00 UTC
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cronjob-based-keepalive:
    name: Prevent Inactivity Schedule Disabling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true


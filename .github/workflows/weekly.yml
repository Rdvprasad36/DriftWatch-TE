name: Weekly Pipeline

on:
  schedule:
    # Run every Monday at 00:00 UTC (architecture.md §6)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week date (e.g. 2026-10-19). Defaults to current UTC date."
        required: false
        default: ""
        type: string
      trials:
        description: "Number of trials per scenario"
        required: false
        default: 5
        type: number
      suites:
        description: "Comma-separated suites to run"
        required: false
        default: "canary,control,attacks_v1"
        type: string

jobs:
  run-model:
    name: Run ${{ matrix.model }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [groq, google, openrouter]
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determine week date
        id: set-week
        run: |
          INPUT_WEEK="${{ inputs.week }}"
          if [ -n "$INPUT_WEEK" ]; then
            WEEK="$INPUT_WEEK"
          else
            WEEK=$(date -u +%Y-%m-%d)
          fi
          echo "WEEK=$WEEK" >> $GITHUB_ENV
          echo "week=$WEEK" >> $GITHUB_OUTPUT

      - name: Run canary prompts (temperature 0)
        run: |
          python -m driftwatch.cli.main canary \
            --week "${{ env.WEEK }}" \
            --models "${{ matrix.model }}" \
            --results-dir "weekly"

      - name: Run evaluation trials
        run: |
          python -m driftwatch.cli.main run \
            --week "${{ env.WEEK }}" \
            --suites "${{ inputs.suites || 'canary,control,attacks_v1' }}" \
            --models "${{ matrix.model }}" \
            --trials ${{ inputs.trials || 5 }} \
            --results-dir "weekly"

      - name: Upload model bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.model }}
          path: weekly/${{ env.WEEK }}/
          retention-days: 7

  finalize:
    name: Finalize, Summarize, and Publish
    needs: run-model
    runs-on: ubuntu-latest
    if: always()
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determine week date
        run: |
          INPUT_WEEK="${{ inputs.week }}"
          if [ -n "$INPUT_WEEK" ]; then
            WEEK="$INPUT_WEEK"
          else
            WEEK=$(date -u +%Y-%m-%d)
          fi
          echo "WEEK=$WEEK" >> $GITHUB_ENV

      - name: Download all model artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts/

      - name: Merge results into weekly run directory
        run: |
          mkdir -p "weekly/${{ env.WEEK }}"
          find downloaded-artifacts/ -type f -exec cp -u {} "weekly/${{ env.WEEK }}/" \;
          ls -la "weekly/${{ env.WEEK }}/"

      - name: Generate summary JSON
        run: |
          if [ -f "weekly/${{ env.WEEK }}/trials.parquet" ]; then
            python -m driftwatch.cli.main summarize \
              --week "${{ env.WEEK }}" \
              --results-dir "weekly" \
              --output-dir "results/summary"
          fi

      - name: Commit summary to git (FR7)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "results/summary/${{ env.WEEK }}.json" ]; then
            git add "results/summary/${{ env.WEEK }}.json"
            git diff --staged --quiet || git commit -m "chore(data): summary for week ${{ env.WEEK }} (FR7)"
            git push origin HEAD || echo "No changes or push failed"
          fi


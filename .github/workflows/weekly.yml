name: Weekly Evaluation Pipeline

on:
  schedule:
    # Run every Monday at 00:00 UTC (architecture.md §6)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week date (e.g. 2026-11-09). Defaults to current UTC date."
        required: false
        default: ""
        type: string
      trials:
        description: "Number of trials per scenario"
        required: false
        default: 5
        type: number
      suites:
        description: "Comma-separated suites to run"
        required: false
        default: "canary,control,attacks_v1"
        type: string
      dry_run:
        description: "Run evaluation even before study start date"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: "weekly-eval"
  cancel-in-progress: false

jobs:
  preflight:
    name: Pre-flight Verification & Schedule Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      week: ${{ steps.gate.outputs.week }}
      is_dry_run: ${{ steps.gate.outputs.is_dry_run }}
      is_study_week: ${{ steps.gate.outputs.is_study_week }}
      trials: ${{ steps.gate.outputs.trials }}
      attacks_trials: ${{ steps.gate.outputs.attacks_trials }}
      control_trials: ${{ steps.gate.outputs.control_trials }}
      canary_trials: ${{ steps.gate.outputs.canary_trials }}
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Suite Integrity (FR1)
        run: |
          python -m driftwatch.cli.main verify

      - name: Check Study Schedule Gate
        id: gate
        run: |
          python - << 'EOF'
          import os
          import sys
          from datetime import UTC, datetime
          from driftwatch.config import load_study_config

          config = load_study_config()
          start_date = config.study_start_date
          now_utc = datetime.now(UTC).strftime("%Y-%m-%d")

          input_week = "${{ inputs.week }}".strip()
          week = input_week if input_week else now_utc

          dry_run = "${{ inputs.dry_run }}".lower() == "true"
          is_before_start = week < start_date
          is_study_week = not is_before_start and not dry_run

          trials_input = "${{ inputs.trials }}".strip()
          t_cfg = config.trials_per_scenario
          attacks_t = int(trials_input) if trials_input and trials_input != "0" else t_cfg.get("attacks_v1", 10)
          control_t = int(trials_input) if trials_input and trials_input != "0" else t_cfg.get("control", 5)
          canary_t = int(trials_input) if trials_input and trials_input != "0" else t_cfg.get("canary", 2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"week={week}\n")
              f.write(f"is_dry_run={'true' if dry_run else 'false'}\n")
              f.write(f"is_study_week={'true' if is_study_week else 'false'}\n")
              f.write(f"attacks_trials={attacks_t}\n")
              f.write(f"control_trials={control_t}\n")
              f.write(f"canary_trials={canary_t}\n")
              f.write(f"trials={attacks_t}\n")

          if is_before_start and not dry_run:
              print(f"Current date {week} is prior to pre-registered STUDY_START_DATE ({start_date}).")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(
                      "### Pre-Study Schedule Gate\n"
                      f"**Current UTC Date:** `{week}`  \n"
                      f"**Study Start Date:** `{start_date}`  \n\n"
                      "> **Before study start, no data collected**\n"
                  )
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("should_run=false\n")
              sys.exit(0)

          # Fail closed for study weeks: verify required secrets & hf_dataset_repo
          if is_study_week:
              # Non-dry-run study weeks require frozen suites ('frozen': true)
              from pathlib import Path
              from driftwatch.suites.integrity import is_suites_frozen
              if not is_suites_frozen(Path("suites")):
                  print("FAIL-CLOSED PREFLIGHT ERROR: Suites are not frozen ('frozen': true required in suites/SUITE_LOCK.json).")
                  print("Run 'driftwatch freeze' to lock benchmark suites before formal study weeks.")
                  sys.exit(1)

              required_secrets = [
                  "GROQ_API_KEY",
                  "GOOGLE_AI_API_KEY",
                  "OPENROUTER_API_KEY",
                  "HF_TOKEN",
              ]
              missing = []
              for sec in required_secrets:
                  if not os.environ.get(sec, "").strip():
                      missing.append(sec)

              hf_repo = (config.hf_dataset_repo or "").strip()
              if not hf_repo or hf_repo == "TODO":
                  missing.append("hf_dataset_repo (in config/study.yaml is 'TODO' or unset)")

              if missing:
                  print("FAIL-CLOSED PREFLIGHT ERROR: Missing required secrets or repository configuration:")
                  for item in missing:
                      print(f"  - {item}")
                  print("Aborting evaluation run before executing any study evaluation jobs.")
                  sys.exit(1)

          print(f"Proceeding with evaluation run for week {week} (dry_run={dry_run}, is_study_week={is_study_week}).")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("should_run=true\n")
          EOF

  evaluate-hosted:
    name: Evaluate ${{ matrix.model }}
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        model: [groq, google, openrouter]
    concurrency:
      group: "provider-${{ matrix.model }}"
      cancel-in-progress: false
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      WEEK: ${{ needs.preflight.outputs.week }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run canary prompts (temperature 0) with retry
        run: |
          max_attempts=3
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Canary attempt $attempt/$max_attempts"
            if timeout 600 python -m driftwatch.cli.main canary \
              --week "${{ env.WEEK }}" \
              --models "${{ matrix.model }}" \
              --results-dir "weekly"; then
              echo "Canary prompts succeeded on attempt $attempt"
              break
            fi
            if [ $attempt -lt $max_attempts ]; then
              delay=$((15 * (2 ** (attempt - 1))))
              echo "Canary attempt $attempt failed, retrying in ${delay}s..."
              sleep $delay
            else
              echo "Canary prompts failed after $max_attempts attempts"
              exit 1
            fi
          done

      - name: Run evaluation trials with retry
        run: |
          max_attempts=3
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Evaluation attempt $attempt/$max_attempts"
            if timeout 1500 python -m driftwatch.cli.main run \
              --week "${{ env.WEEK }}" \
              --suites "${{ inputs.suites || 'canary,control,attacks_v1' }}" \
              --models "${{ matrix.model }}" \
              --trials ${{ needs.preflight.outputs.attacks_trials || inputs.trials || 10 }} \
              --results-dir "weekly"; then
              echo "Evaluation succeeded on attempt $attempt"
              break
            fi
            if [ $attempt -lt $max_attempts ]; then
              delay=$((30 * (2 ** (attempt - 1))))
              echo "Evaluation attempt $attempt failed, retrying in ${delay}s..."
              sleep $delay
            else
              echo "Evaluation failed after $max_attempts attempts"
              exit 1
            fi
          done

      - name: Upload model bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.model }}
          path: weekly/${{ env.WEEK }}/
          retention-days: 7

  evaluate-local:
    name: Evaluate local (Pinned Reference via Ollama)
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      WEEK: ${{ needs.preflight.outputs.week }}
      LOCAL_MODEL_URL: "http://localhost:11434"
      LOCAL_MODEL: "llama3.2:1b"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install and launch Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          echo "Waiting for Ollama service to become ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:11434/api/version > /dev/null 2>&1; then
              echo "Ollama is ready (attempt $i)."
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:11434/api/version > /dev/null 2>&1; then
            echo "ERROR: Ollama failed to start within 30 seconds."
            cat /tmp/ollama.log 2>/dev/null || true
            exit 1
          fi

      - name: Pull pinned local reference model and verify digest
        run: |
          ollama pull llama3.2:1b
          echo "=== Verifying Local Model Digest ==="
          PULLED_DIGEST=$(ollama list | grep 'llama3.2:1b' | awk '{print $2}')
          echo "Pulled model digest: $PULLED_DIGEST"

          python - << 'EOF'
          import os
          import sys
          from driftwatch.config import load_study_config

          config = load_study_config()
          expected_digest = (config.local_model_digest or "").strip()
          actual_digest = os.environ.get("PULLED_DIGEST", "").strip()

          print(f"Expected digest (config/study.yaml): {expected_digest}")
          print(f"Actual digest (ollama list):         {actual_digest}")

          if not expected_digest:
              print("ERROR: local_model_digest is not configured in config/study.yaml")
              sys.exit(1)

          if not (actual_digest == expected_digest or actual_digest.startswith(expected_digest) or expected_digest.startswith(actual_digest)):
              print(f"ERROR: Model digest mismatch! Expected '{expected_digest}', but got '{actual_digest}'")
              sys.exit(1)

          print("Local reference model digest successfully verified.")
          EOF

      - name: Run canary prompts on local model
        timeout-minutes: 15
        run: |
          python -m driftwatch.cli.main canary \
            --week "${{ env.WEEK }}" \
            --models "local" \
            --results-dir "weekly"

      - name: Run evaluation trials on local model
        timeout-minutes: 25
        run: |
          python -m driftwatch.cli.main run \
            --week "${{ env.WEEK }}" \
            --suites "${{ inputs.suites || 'canary,control,attacks_v1' }}" \
            --models "local" \
            --trials ${{ needs.preflight.outputs.attacks_trials || inputs.trials || 10 }} \
            --results-dir "weekly"

      - name: Upload local bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-local
          path: weekly/${{ env.WEEK }}/
          retention-days: 7

  finalize:
    name: Finalize, Summarize & Report
    needs: [preflight, evaluate-hosted, evaluate-local]
    if: always() && needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WEEK: ${{ needs.preflight.outputs.week }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download all model artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts/

      - name: Merge results into weekly run directory
        run: |
          mkdir -p "weekly/${{ env.WEEK }}"
          find downloaded-artifacts/ -type f -exec cp -u {} "weekly/${{ env.WEEK }}/" \;
          ls -la "weekly/${{ env.WEEK }}/"

      - name: Finalize Parquet bundle
        run: |
          python -c "from driftwatch.storage.bundle import finalize_bundle; from pathlib import Path; finalize_bundle(Path('weekly/${{ env.WEEK }}'), week='${{ env.WEEK }}', allow_overwrite=True)"

      - name: Upload bundle to Hugging Face Dataset (FR7)
        continue-on-error: ${{ needs.preflight.outputs.is_dry_run == 'true' }}
        run: |
          python - << 'EOF'
          import os
          import sys
          from pathlib import Path
          from driftwatch.config import load_study_config
          from driftwatch.storage.hf_upload import upload_weekly_bundle

          config = load_study_config()
          hf_repo = config.hf_dataset_repo
          token = os.environ.get("HF_TOKEN")
          is_study_week = "${{ needs.preflight.outputs.is_study_week }}" == "true"
          week = "${{ env.WEEK }}"

          if is_study_week:
              if not hf_repo or hf_repo == "TODO":
                  print("ERROR: Hugging Face dataset repo not configured ('TODO') for study week.")
                  sys.exit(1)
              if not token:
                  print("ERROR: HF_TOKEN is unset or empty for study week.")
                  sys.exit(1)
              print(f"Mandatory HF upload: uploading weekly bundle to {hf_repo}")
              upload_weekly_bundle(
                  repo_id=hf_repo,
                  weekly_run_dir=Path(f"weekly/{week}"),
                  week=week,
                  token=token,
                  is_dry_run=False,
              )
              print("Hugging Face dataset upload completed successfully.")
          else:
              if hf_repo and hf_repo != "TODO" and token:
                  print(f"Optional HF upload for dry run: uploading weekly bundle to {hf_repo}")
                  upload_weekly_bundle(
                      repo_id=hf_repo,
                      weekly_run_dir=Path(f"weekly/{week}"),
                      week=week,
                      token=token,
                      is_dry_run=True,
                  )
              else:
                  print("Dry run: skipping optional HF upload (hf_dataset_repo is 'TODO' or HF_TOKEN unset).")
          EOF

      - name: Generate summary JSON
        run: |
          python -m driftwatch.cli.main summarize \
            --week "${{ env.WEEK }}" \
            --results-dir "weekly" \
            --output-dir "results/summary"

      - name: Completeness Gate & Issue Notification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from driftwatch.config import load_study_config
          from driftwatch.storage.summary import update_summary_index

          week = "${{ env.WEEK }}"
          summary_path = Path(f"results/summary/weekly/{week}.json")
          meta_path = Path(f"weekly/{week}/meta.json")

          if not summary_path.is_file():
              print(f"ERROR: Summary file {summary_path} not found.")
              sys.exit(1)

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          config = load_study_config()

          models_data = summary.get("models", {})
          missing_models = []
          for m in config.models:
              alias = m.alias
              m_info = models_data.get(alias)
              if not m_info or m_info.get("total_trials", 0) == 0:
                  missing_models.append(alias)

          if missing_models:
              print(f"COMPLETENESS ALERT: Model(s) with 0 completed trials for week {week}: {missing_models}")
              summary["complete"] = False
              summary["status"] = "incomplete"
              summary["incomplete_models"] = missing_models
              summary_path.write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding="utf-8")

              if meta_path.is_file():
                  meta = json.loads(meta_path.read_text(encoding="utf-8"))
                  meta["complete"] = False
                  meta["status"] = "incomplete"
                  meta["incomplete_models"] = missing_models
                  meta_path.write_text(json.dumps(meta, indent=2, ensure_ascii=False), encoding="utf-8")

              # Update index.json so incomplete week is marked incomplete and not published as complete
              update_summary_index(Path("results/summary"))

              # Open GitHub issue
              title = f"[Incomplete Evaluation] Week {week}: 0 trials for {', '.join(missing_models)}"
              body = (
                  f"### Completeness Gate Failure\n\n"
                  f"Weekly evaluation run for `{week}` is **incomplete**.\n\n"
                  f"The following configured models had 0 completed trials:\n"
                  + "\n".join(f"- `{m}`" for m in missing_models)
                  + f"\n\n**Actions taken:**\n"
                  f"- Metadata in `weekly/{week}/meta.json` and summary in `results/summary/weekly/{week}.json` marked as `complete: false`.\n"
                  f"- Week is excluded from complete published runs in `results/summary/index.json`."
              )
              Path("/tmp/incomplete_issue.md").write_text(body, encoding="utf-8")
              try:
                  subprocess.run(
                      ["gh", "issue", "create", "--title", title, "--body-file", "/tmp/incomplete_issue.md", "--label", "bug"],
                      check=False,
                  )
              except Exception as exc:
                  print(f"Notice: could not create GitHub issue: {exc}")
          else:
              print(f"All configured models completed trials for week {week}. Week is complete.")
          EOF

      - name: Export trial records (CSV, JSONL, Schema)
        run: |
          python -m driftwatch.cli.main export \
            --weekly-dir "weekly" \
            --results-dir "results"

      - name: Run statistical analysis pipeline (GEE, TOST, PELT)
        run: |
          python -m driftwatch.cli.main analyze \
            --weekly-dir "weekly" \
            --output-file "results/analysis/analysis.json"

      - name: Generate weekly Markdown and HTML report
        run: |
          python -m driftwatch.cli.main weekly-report "${{ env.WEEK }}" \
            --summary-dir "results/summary" \
            --analysis-file "results/analysis/analysis.json" \
            --weekly-dir "weekly" \
            --output-dir "reports/weekly"

      - name: Generate comprehensive scientific report
        run: |
          python -m driftwatch.cli.main report \
            --analysis-file "results/analysis/analysis.json" \
            --index-file "results/summary/index.json" \
            --output-dir "reports"

      - name: Commit generated results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ reports/
          git diff --staged --quiet || git commit -m "chore(data): weekly evaluation for ${{ env.WEEK }} [skip ci]"
          git push origin HEAD || echo "Push failed or branch protected"

  deploy:
    name: Deploy to GitHub Pages
    needs: finalize
    if: always() && needs.finalize.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build site directory
        run: |
          mkdir -p site
          cp -r dashboard/* site/
          mkdir -p site/results/summary site/results/analysis site/results/exports site/reports/weekly

          cp -r results/summary/* site/results/summary/ 2>/dev/null || true
          cp -r results/analysis/* site/results/analysis/ 2>/dev/null || true
          cp -r results/exports/* site/results/exports/ 2>/dev/null || true
          [ -f results/events.json ] && cp results/events.json site/results/ || true
          cp -r reports/* site/reports/ 2>/dev/null || true

          # Strict exclusions
          rm -rf site/dev
          if grep -rn '"sample": true' site/ 2>/dev/null; then
            echo "ERROR: Sample data detected in site/"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

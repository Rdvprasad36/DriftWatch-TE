name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "results/summary/**"
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site directory
        run: |
          mkdir -p _site/data
          # Copy dashboard files if dashboard directory exists
          if [ -d "dashboard" ]; then
            cp -r dashboard/* _site/
          else
            # Minimal index placeholder if dashboard is built in Step 12
            echo '<!DOCTYPE html><html><head><title>DriftWatch-TE Dashboard</title></head><body><h1>DriftWatch-TE</h1><p>Dashboard coming in Phase 1.</p></body></html>' > _site/index.html
          fi
          # Copy summary data files
          if [ -d "results/summary" ]; then
            cp -r results/summary/* _site/data/ 2>/dev/null || true
            mkdir -p _site/results/summary
            cp -r results/summary/* _site/results/summary/ 2>/dev/null || true
          fi
          # Copy events if present
          if [ -d "events" ]; then
            mkdir -p _site/events
            cp -r events/* _site/events/ 2>/dev/null || true
          fi
          # Copy suite lock if present
          if [ -f "suites/SUITE_LOCK.json" ]; then
            mkdir -p _site/suites
            cp suites/SUITE_LOCK.json _site/suites/ 2>/dev/null || true
          fi
          # Copy branding if present
          if [ -d "branding" ]; then
            mkdir -p _site/branding
            cp -r branding/* _site/branding/ 2>/dev/null || true
          fi
          # Strict exclusion: never publish developer sample fixtures to GitHub Pages
          rm -rf _site/dev
          if [ -d "_site/dev" ]; then
            echo "ERROR: dashboard/dev must never be published to GitHub Pages"
            exit 1
          fi
          if grep -rn '"sample": true' _site/ 2>/dev/null; then
            echo "ERROR: Sample test data detected in published artifact"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "results/**"
      - "reports/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site directory
        run: |
          mkdir -p site
          # Copy dashboard files
          cp -r dashboard/* site/

          # Copy data contracts and reports into site/
          mkdir -p site/results/summary site/results/analysis site/results/exports site/reports/weekly

          [ -d "results/summary" ] && cp -r results/summary/* site/results/summary/ 2>/dev/null || true
          [ -d "results/analysis" ] && cp -r results/analysis/* site/results/analysis/ 2>/dev/null || true
          [ -d "results/exports" ] && cp -r results/exports/* site/results/exports/ 2>/dev/null || true
          [ -f "results/events.json" ] && cp results/events.json site/results/ 2>/dev/null || true
          [ -d "reports" ] && cp -r reports/* site/reports/ 2>/dev/null || true

          # Strict exclusion: developer sample fixtures must never reach the published site
          rm -rf _site/dev site/dev
          if [ -d "site/dev" ] || [ -d "_site/dev" ]; then
            echo "ERROR: dashboard/dev must never be published to GitHub Pages"
            exit 1
          fi

          if grep -rn '"sample": true' site/ 2>/dev/null; then
            echo "ERROR: Sample test data detected in published artifact"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

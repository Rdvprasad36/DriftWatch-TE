[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftwatch"
version = "0.1.0"
description = "Longitudinal study of security drift in hosted LLM agents"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
    "click>=8.0",
    "httpx>=0.27",
    "pyarrow>=17.0",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pandas>=2.0",
    "ruptures>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
driftwatch = "driftwatch.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/driftwatch"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["driftwatch"]

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "ruptures",
    "statsmodels",
    "statsmodels.*",
    "scipy",
    "scipy.*",
    "pandas",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests that call real LLM APIs (skipped by default)",
]
addopts = "-m 'not live'"

